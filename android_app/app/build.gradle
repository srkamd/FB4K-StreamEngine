plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fb4kdownloader.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.fb4kdownloader.app"
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName "1.0.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile rootProject.file('release-key.jks')
            storePassword 'fb4kdownloaderpass'
            keyAlias 'fb4k-key-alias'
            keyPassword 'fb4kdownloaderpass'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    
    // Google Mobile Ads (AdMob) SDK for High-eCPM Monetization
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
}
