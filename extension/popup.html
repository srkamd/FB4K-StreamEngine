<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FB4KDownloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="ext-container">
    
    <!-- Top Header -->
    <header class="ext-header">
      <div class="logo-box">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#fbbf24" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
        </div>
        <div class="logo-text">FB4K<span>Downloader</span></div>
      </div>
      <span class="badge-version">v2.0</span>
    </header>

    <!-- Active Tab Status Detection -->
    <div class="status-card" id="status-card">
      <div class="status-indicator" id="status-dot"></div>
      <span id="status-msg">Scanning active tab...</span>
    </div>

    <!-- Main Body Action -->
    <main class="ext-body">
      
      <!-- Video / Reel URL Input -->
      <div class="input-wrapper">
        <input type="text" id="ext-url-input" placeholder="Paste Facebook Reel or video link..." spellcheck="false">
        <button id="btn-paste" title="Paste from clipboard">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
          </svg>
        </button>
      </div>

      <!-- Format Selection Grid -->
      <div class="format-grid">
        <button class="fmt-btn active" data-format="4k">
          <span class="fmt-name">4K Ultra HD</span>
          <span class="fmt-tag">Best</span>
        </button>
        <button class="fmt-btn" data-format="1080p">
          <span class="fmt-name">1080p Full HD</span>
          <span class="fmt-tag">HD</span>
        </button>
        <button class="fmt-btn" data-format="720p">
          <span class="fmt-name">720p Standard</span>
          <span class="fmt-tag">SD</span>
        </button>
        <button class="fmt-btn" data-format="mp3">
          <span class="fmt-name">320kbps MP3</span>
          <span class="fmt-tag">Audio</span>
        </button>
      </div>

      <!-- Main Action Button -->
      <button id="btn-download" class="btn-download-primary">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span id="btn-text">Download Reel Now</span>
      </button>

      <!-- Tip Callout -->
      <div class="tip-box">
        <span class="tip-icon">✨</span>
        <p><strong>On-Reel Download:</strong> While browsing Facebook, just click the glowing <strong>4K icon</strong> right on any Reel to download instantly!</p>
      </div>

    </main>

    <!-- Footer Links -->
    <footer class="ext-footer">
      <a href="https://fb4kdownloader.com" target="_blank" class="footer-link">
        🌐 fb4kdownloader.com
      </a>
      <span class="footer-separator">•</span>
      <a href="https://fb4kdownloader.com/contact" target="_blank" class="footer-link">Support</a>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
